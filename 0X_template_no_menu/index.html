<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web template with p5.js</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/skeleton/2.0.4/skeleton.min.css"
        integrity="sha512-EZLkOqwILORob+p0BXZc+Vm3RgJBOe1Iq/0fiI7r/wJgzOFZMlsqTa29UEl6v6U6gsV4uIpsNZoV32YZqrCRCQ=="
        crossorigin="anonymous" referrerpolicy="no-referrer" />
    <link rel="stylesheet" href="index.css">
    <link rel="stylesheet" href="api_lib/myApiStyles.css">
    <script src="../api_lib/myClasses.js"></script>
    <script src="../api_lib/api_classes.js"></script>
    <script src="../api_lib/myApi.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/p5@1.11.10/lib/p5.min.js"></script>
    <link rel="stylesheet" type="text/css" href="//fonts.googleapis.com/css?family=Cabin+Sketch" />
</head>

<body>
    <main>
        <div class="page" id="page1">
            <br><br>
            <h1><a style="font-size: 50px; color:black;">The 3 REALLY fun small mini awesome greatest lovy-dovy brightest funny mini</a> Game</h1>
            <div class="drawings">
                <canvas id="myCanvas" width="400" height="300"></canvas>
            </div>
        </div>


        <div class="page show" id="page2">

            <div class="logo">
            <img src="./assest/Logo.jpeg" alt="Logo">
            </div>
            <div class="loading_circle"></div>
        </div>


        <div class="page" id="page3">
            <div class="options">
                <h1>Options &#9881;&#65039;</h1>
                <p class="options-intro">Stabilize your game's features:</p>

                <div class="option-row">
                    <label for="difficultyRange">Difficulty &#128170;</label>
                    <div class="DifficultySlider">
                        <input type="range" min="1" max="100" value="50" class="slider" id="difficultyRange">
                    </div>
                    <span id="difficultyLabel" class="option-value"></span>
                </div>

                <div class="option-row">
                    <label for="brightnessRange">Brightness &#127775;</label>
                    <div class="BrightnessSlider">
                        <input type="range" min="1" max="100" value="50" class="slider" id="brightnessRange">
                    </div>
                    <span id="brightnessLabel" class="option-value"></span>
                </div>

                <div class="option-row">
                    <label for="soundSwitch">Sound &#128264;</label>
                    <label class="switch">
                        <input type="checkbox" id="soundSwitch" checked>
                        <span class="switch-track"></span>
                    </label>
                    <span id="soundLabel" class="option-value"></span>
                </div>

                <div class="drawings">
                    <canvas id="myCanvas2" width="400" height="150"></canvas>
                </div>
            </div>
        </div>
        <div class="page" id="page4">
            <div class="drawings">
                <div class="maze-wrap">
                    <div class="maze-stage"><canvas id="MazeHaze" width="1000" height="1000"></canvas></div>
                </div>
            </div>
        </div>
        <div class="page" id="page5">
            <div class="drawings">
                <canvas id="FillHoles" width="1000" height="1000"></canvas>
            </div>
        </div>
        <div class="page" id="page6">
            <h1>seb shoter</h1>
            </div>
        </div>
        <div class="page" id="page7">
            <h1>final screen</h1>
        </div>
    </main>
    <script src="../node_modules/roughjs/bundled/rough.js"></script>
    <script src="./index.js"></script>
    <script src="./fillholes.js"></script>
    <script src="./maze.js"></script>
</body>

</html>
